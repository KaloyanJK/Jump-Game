<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Defines character encoding and responsive behavior -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Meta description for SEO -->
  <meta name="description"
    content="Play a fun runner game where you jump over obstacles and try to beat your high score. Includes a weather checker and dark mode support." />

  <!-- Page title shown in browser tab -->
  <title>Runner Game</title>

  <!-- Preload Image -->
  <link rel="preload" as="image" href="assets/images/background-2.webp" fetchpriority="high">

  <!-- Bootstrap CSS for layout and responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Font Awesome for icons (player, obstacle, buttons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Custom CSS for game styling -->
  <link rel="stylesheet" href="assets/css/style-game.css" />
</head>

<body>
  <!-- =========================
       HEADER / NAVIGATION BAR
       Contains logo and page links
       ========================= -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light" aria-label="Main navigation">
      <div class="container-fluid">

        <!-- Site logo -->
        <img src="assets/images/logo.webp" alt="logo" width="52" loading="lazy" class="d-inline-block align-text-top" />

        <!-- Mobile menu toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation links -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <!-- Link to game page -->
              <a class="nav-link active" href="index.html" aria-current="page">Game</a>
            </li>
            <li class="nav-item">
              <!-- Link to weather checker page -->
              <a class="nav-link" href="weather.html">Weather Checker</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- =========================
       MAIN GAME CONTENT AREA
       ========================= -->
  <main class="container-fluid px-0 text-center">

    <!-- Dark mode toggle switch -->
    <div class="dark-toggle-bar" aria-label="Theme switcher">
      <div class="dark-toggle">
        <!-- Labels showing current mode -->
        <span class="toggle-label">
          <span class="toggle-light">Dark Mode</span>
          <span class="toggle-dark">Light Mode</span>
        </span>

        <!-- Toggle checkbox for theme switching -->
        <label class="dark-switch">
          <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode" />
          <span class="dark-slider" aria-hidden="true"></span>
        </label>

        <!-- Icon that changes depending on theme -->
        <span id="themeIcon" class="dark-icon" aria-hidden="true">☀️</span>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-3 mt-auto">
    <small>Runner Game by Kal © 2026</small>
  </footer>

  <!-- Bootstrap JS (used for navbar toggle functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Custom JavaScript handling game logic and interactions -->
  <script src="assets/js/script.js"></script>

</body>

</html>
