<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Defines character encoding and responsive behavior -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Meta description for SEO -->
  <meta name="description"
    content="Play a fun runner game where you jump over obstacles and try to beat your high score. Includes a weather checker and dark mode support." />

  <!-- Page title shown in browser tab -->
  <title>Runner Game</title>

  <!-- Preload Image -->
  <link rel="preload" as="image" href="assets/images/background-2.webp" fetchpriority="high">

  <!-- Bootstrap CSS for layout and responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Font Awesome for icons (player, obstacle, buttons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Custom CSS for game styling -->
  <link rel="stylesheet" href="assets/css/style-game.css" />
</head>

<body>

  <!-- Bootstrap JS (used for navbar toggle functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Custom JavaScript handling game logic and interactions -->
  <script src="assets/js/script.js"></script>
  
</body>
</html>
