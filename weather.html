<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="View real-time weather..." />
  <title>Weather Checker</title>

  <!-- Preconnect (keep minimal) -->
  <link rel="preconnect" href="https://api.openweathermap.org">

  <!-- Bootstrap CSS for layout and responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Font Awesome for icons (player, obstacle, buttons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Custom CSS for game styling -->
  <link rel="stylesheet" href="assets/css/style-weather.css" />
</head>

<body>

  <!-- =========================
       HEADER / NAVIGATION BAR
       Contains logo and page links
       ========================= -->
  <header>
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
      <div class="container-fluid">

        <!-- Logo image representing the weather app -->
        <img src="assets/images/logo-weather-2.webp" alt="Weather app logo" width="52" />

        <!-- Button for toggling navbar on mobile devices -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation links (collapsible on smaller screens) -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">

            <!-- Link to the game page -->
            <li class="nav-item">
              <a class="nav-link" href="index.html">Game</a>
            </li>

            <!-- Link to current page (active state) -->
            <li class="nav-item">
              <a class="nav-link active" href="weather.html" aria-current="page">Weather Checker</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <!-- =========================
       MAIN CONTENT AREA
       ========================= -->
  <main id="weather-main" role="main" class="d-flex flex-column justify-content-center align-items-center flex-fill">
    <!--
      Main container settings:
      - d-flex → enables flexbox layout
      - justify-content-center → vertically centers content
      - align-items-center → horizontally centers content
      - flex-fill → expands to fill available height
    -->

    <!-- =========================
         DARK MODE TOGGLE
         ========================= -->
    <div class="dark-toggle-bar" aria-label="Theme switcher">
      <div class="dark-toggle">

        <!-- Text labels that change based on theme -->
        <span class="toggle-label">
          <span class="toggle-light">Dark Mode</span>
          <span class="toggle-dark">Light Mode</span>
        </span>

        <!-- Toggle switch (checkbox used for switching theme) -->
        <label class="dark-switch">
          <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode" />

          <!-- Visual slider for switch -->
          <span class="dark-slider" aria-hidden="true"></span>
        </label>

        <!-- Icon that changes depending on theme -->
        <span id="themeIcon" class="dark-icon" aria-hidden="true">☀️</span>
      </div>
    </div>

    <!-- WEATHER CARD Displays live weather data -->
    <section class="card p-4 shadow-lg text-center weather-card" aria-labelledby="weather-title">

      <!-- Section title -->
      <h2 id="weather-title" class="h5 mb-3">Current Weather</h2>

      <!-- Weather icon (loaded dynamically via JavaScript) -->
      <img id="icon" src="assets/images/logo-weather.webp" alt="Weather icon" class="mx-auto mb-2" width="80"
        height="80" fetchpriority="high" />


      <!-- City name (updated dynamically) -->
      <div id="city" class="h4 fw-semibold" aria-live="polite">
        Fetching weather...
      </div>

      <!-- Temperature display -->
      <div id="temp" class="display-6 fw-bold my-2" aria-live="polite">
      </div>

      <!-- Weather description (e.g., cloudy, sunny) -->
      <p id="desc" class="mb-1" aria-live="polite">
      </p>

      <!-- Extra details (humidity, wind speed, etc.) -->
      <div id="extra" class="small" aria-live="polite">
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer text-center py-3 mt-auto">

    <!-- Simple copyright notice -->
    <small>Weather App by Kal © 2026</small>

  </footer>

  <!-- Bootstrap JavaScript bundle (needed for navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- defer allows HTML to render first -->

  <!-- Custom script handling:
       - Weather API calls
       - Updating UI dynamically
       - Theme toggle functionality -->
  <script src="assets/js/script.js" defer></script>

</body>

</html>
