<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="View real-time weather..." />
  <title>Weather Checker</title>

  <!-- Preconnect (keep minimal) -->
  <link rel="preconnect" href="https://api.openweathermap.org">

  <!-- Bootstrap CSS for layout and responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Font Awesome for icons (player, obstacle, buttons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Custom CSS for game styling -->
  <link rel="stylesheet" href="assets/css/style-weather.css" />
</head>

<body>

  <!-- Bootstrap JavaScript bundle (needed for navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- defer allows HTML to render first -->

  <!-- Custom script handling:
       - Weather API calls
       - Updating UI dynamically
       - Theme toggle functionality -->
  <script src="assets/js/script.js" defer></script>
  
</body>
</html>
